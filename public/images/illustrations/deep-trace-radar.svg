<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
    <defs>
        <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25"/>
            <stop offset="70%" stop-color="#1E40AF" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.05"/>
        </linearGradient>
    </defs>
    <!-- Background Circles (Deep Trace Concentric Radar) -->
    <circle cx="250" cy="250" r="230" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="250" cy="250" r="180" stroke="#93C5FD" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="120" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="250" cy="250" r="60" fill="url(#radarGlow)" stroke="#2563EB" stroke-width="2"/>
    <!-- Crosshairs -->
    <line x1="20" y1="250" x2="480" y2="250" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="250" y1="20" x2="250" y2="480" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="87" y1="87" x2="413" y2="413" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="87" y1="413" x2="413" y2="87" stroke="#F1F5F9" stroke-width="1"/>
    <!-- Radar Sweep Cone -->
    <path d="M 250 250 L 390 110 A 180 180 0 0 1 430 250 Z" fill="url(#beamGrad)"/>
    <!-- Verified Target Points -->
    <circle cx="340" cy="180" r="6" fill="#D97706"/>
    <circle cx="340" cy="180" r="12" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="160" cy="310" r="5" fill="#2563EB"/>
    <circle cx="160" cy="310" r="10" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Center Core Point -->
    <circle cx="250" cy="250" r="8" fill="#1D4ED8"/>
    <circle cx="250" cy="250" r="3" fill="#FFFFFF"/>
</svg>

