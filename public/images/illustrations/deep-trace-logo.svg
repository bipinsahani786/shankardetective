<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
    <!-- Emblem -->
    <g transform="translate(4, 4)">
        <rect width="56" height="56" rx="14" fill="#1E3A8A"/>
        <!-- Radar Ring -->
        <circle cx="28" cy="28" r="18" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle cx="28" cy="28" r="11" stroke="#D97706" stroke-width="2"/>
        <!-- Magnifier Lens & Handle -->
        <circle cx="26" cy="26" r="9" stroke="#FFFFFF" stroke-width="2.5"/>
        <line x1="33" y1="33" x2="42" y2="42" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <!-- Center Target Ping -->
        <circle cx="26" cy="26" r="3" fill="#F59E0B"/>
    </g>
    <!-- Brand Typography -->
    <text x="72" y="30" font-family="'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="1.5" fill="#0F172A">DEEP TRACE</text>
    <text x="72" y="47" font-family="'Inter', sans-serif" font-weight="700" font-size="12" letter-spacing="3" fill="#1D4ED8">DETECTIVE</text>
    <circle cx="166" cy="44" r="2.5" fill="#D97706"/>
    <text x="174" y="47" font-family="'Inter', sans-serif" font-weight="600" font-size="9" letter-spacing="1" fill="#64748B">INDORE</text>
</svg>

